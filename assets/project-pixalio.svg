<svg xmlns="http://www.w3.org/2000/svg" width="590" height="340" viewBox="0 0 590 340" fill="none">
<defs></defs><style>
  .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace} .s{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif} .r{font-family:Georgia,'Times New Roman',serif}
  .f{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1}}</style>

<rect x="0.5" y="0.5" width="589" height="339" rx="18" fill="#09090d" stroke="#ffffff14"/>
<text class="m f" style="animation-delay:0.00s" x="36" y="52" font-size="11" letter-spacing="2.5" fill="#71717a">SOCIAL PLATFORM  /  MERN</text>
<text class="s f" style="animation-delay:0.08s" x="36" y="94" font-size="24" font-weight="600" letter-spacing="-.5" fill="#f4f4f5">Pixalio</text>
<text class="r f" style="animation-delay:0.08s" x="36" y="124" font-size="24" font-style="italic" fill="#8b8cff">Social Media Platform</text>
<g class="f" style="animation-delay:0.16s"><circle cx="474" cy="92" r="24" fill="#09090d" stroke="#ffffff22" stroke-width="1"/><circle cx="474" cy="92" r="17" fill="#ffffff0a"/><circle cx="508" cy="92" r="24" fill="#09090d" stroke="#ffffff22" stroke-width="1"/><circle cx="508" cy="92" r="17" fill="#ffffff0a"/><circle cx="542" cy="92" r="24" fill="#09090d" stroke="#8b8cff" stroke-width="2"/><circle cx="542" cy="92" r="17" fill="#8b8cff33"/><text class="m" x="554" y="148" text-anchor="end" font-size="11" letter-spacing="2" fill="#71717a">CREATORS  ·  STORIES  ·  CHAT</text></g>
<g class="f" style="animation-delay:0.24s"><text class="s" x="36" y="180" font-size="15" fill="#a1a1aa">A full-stack MERN social platform with secure auth,</text><text class="s" x="36" y="205" font-size="15" fill="#a1a1aa">creator and consumer roles, posts, stories, real-time</text><text class="s" x="36" y="230" font-size="15" fill="#a1a1aa">messaging, user profiles and admin analytics.</text></g>
<g class="f" style="animation-delay:0.32s"><rect x="36" y="274" width="85" height="30" rx="15" fill="#ffffff06" stroke="#ffffff22"/><text class="m" x="78.5" y="294" text-anchor="middle" font-size="12" fill="#e4e4e7">MongoDB</text><rect x="129" y="274" width="85" height="30" rx="15" fill="#ffffff06" stroke="#ffffff22"/><text class="m" x="171.5" y="294" text-anchor="middle" font-size="12" fill="#e4e4e7">Express</text><rect x="222" y="274" width="69" height="30" rx="15" fill="#ffffff06" stroke="#ffffff22"/><text class="m" x="256.5" y="294" text-anchor="middle" font-size="12" fill="#e4e4e7">React</text><rect x="299" y="274" width="85" height="30" rx="15" fill="#ffffff06" stroke="#ffffff22"/><text class="m" x="341.5" y="294" text-anchor="middle" font-size="12" fill="#e4e4e7">Node.js</text></g>
<text class="m f" style="animation-delay:0.40s" x="554" y="294" text-anchor="end" font-size="12" letter-spacing="1.5" fill="#8b8cff">VIEW REPO  ↗</text>
