<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#ffffff08"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#6d6cff" stop-opacity=".28"/><stop offset="1" stop-color="#6d6cff" stop-opacity="0"/></radialGradient>
<linearGradient id="ink" x1="0" x2="1"><stop offset="0" stop-color="#e4e4e7"/><stop offset="1" stop-color="#8b8cff"/></linearGradient></defs><style>
  .m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace} .s{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif} .r{font-family:Georgia,'Times New Roman',serif}
  .f{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1}}.pulse{animation:p 7s ease-in-out infinite}@keyframes p{50%{opacity:.5}}
 .cur{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}</style>

<rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="#09090d" stroke="#ffffff14"/>
<rect x="1" y="1" width="1198" height="418" rx="18" fill="url(#grid)"/>
<circle class="pulse" cx="930" cy="190" r="300" fill="url(#glow)"/>
<g transform="translate(930 205)">
  <circle r="150" stroke="#ffffff22" stroke-dasharray="2 6"/>
  <circle r="100" stroke="#ffffff14"/>
  <circle r="50" stroke="#ffffff22" stroke-dasharray="1 4"/>
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    <circle cx="150" cy="0" r="4" fill="#8b8cff"/><circle cx="-150" cy="0" r="2.5" fill="#a1a1aa"/></g>
  <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    <circle cx="0" cy="100" r="3.5" fill="#c4b5fd"/><circle cx="0" cy="-100" r="2" fill="#71717a"/></g>
  <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#111118" stroke="#ffffff22"/>
  <text class="r" x="0" y="11" text-anchor="middle" font-size="30" font-style="italic" fill="#f4f4f5">hb</text>
</g>
<text class="m f" style="animation-delay:0.00s" x="64" y="84" font-size="13" letter-spacing="3" fill="#8b8cff">CO-FOUNDER  /  AKSALI TECHNOLOGIES</text>
<text class="s f" style="animation-delay:0.08s" x="60" y="178" font-size="80" font-weight="600" letter-spacing="-2" fill="#f4f4f5">Hussain</text>
<text class="r f" style="animation-delay:0.16s" x="62" y="262" font-size="80" font-style="italic" fill="url(#ink)">Hassan Butt</text>
<line class="f" style="animation-delay:0.24s" x1="64" y1="300" x2="640" y2="300" stroke="#ffffff22"/>
<text class="m f" style="animation-delay:0.32s" x="64" y="334" font-size="14" fill="#a1a1aa">Full-stack engineering  <tspan fill="#71717a">·</tspan>  Applied AI  <tspan fill="#71717a">·</tspan>  Cloud  <tspan fill="#71717a">·</tspan>  London, UK</text>
<text class="m f" style="animation-delay:0.40s" x="64" y="370" font-size="14" fill="#71717a">~/aksali <tspan fill="#8b8cff">$</tspan> <tspan fill="#f4f4f5">building software that ships</tspan></text>
<rect class="cur" x="372" y="358" width="9" height="16" fill="#8b8cff"/>

</svg>